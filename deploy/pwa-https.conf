limit_req_zone $binary_remote_addr zone=asis_login:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=asis_web:10m rate=10r/s;

server {
    listen 443 ssl;
    server_name 35.209.202.207;
    ssl_certificate /etc/letsencrypt/live/35.209.202.207/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/35.209.202.207/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    client_max_body_size 16k;
    client_body_timeout 15s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location /auth/ {
        limit_req zone=asis_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8766;
        proxy_set_header Host 35.209.202.207;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
    location / {
        limit_req zone=asis_web burst=20 nodelay;
        proxy_pass http://127.0.0.1:8766;
        proxy_set_header Host 35.209.202.207;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
}
