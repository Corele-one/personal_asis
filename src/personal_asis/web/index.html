<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123e38"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/app.css"><title>Personal Asis · 资料搜索</title><script defer src="/app.js"></script></head>
<body><header><a class="brand" href="/">Personal Asis<span>个人资料 · PA0</span></a><button id="logout" hidden>退出登录</button></header><main>
<section id="welcome"><div class="eyebrow">你的资料，留在自己的设备上</div><h1>找到已有的线索。</h1><p>从手机发起搜索，查看设备状态和获准的资料位置。</p></section>
<p id="notice" role="status" aria-live="polite"></p>
<section id="login" class="panel" hidden><h2>登录私有控制台</h2><form id="login-form"><label>密码<input id="password" type="password" autocomplete="current-password" minlength="14" maxlength="256" required></label><label id="login-otp-label">认证器动态验证码<input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></label><button class="primary">登录</button></form></section>
<section id="setup" class="panel" hidden><h2>设置你的登录凭据</h2><p id="setup-instructions">打开认证器，添加一个基于时间的账号，手动输入下面的密钥。保存好认证器后再设置密码。</p><code id="otp-secret"></code><form id="setup-form"><label>设置密码（至少 14 个字符）<input id="new-password" type="password" autocomplete="new-password" minlength="14" maxlength="256" required></label><label>再次输入密码<input id="confirm-password" type="password" autocomplete="new-password" required></label><label id="setup-otp-label">认证器显示的六位验证码<input id="setup-code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></label><button class="primary">完成设置并登录</button></form></section>
<section id="console" hidden><div id="nodes" class="nodes"></div><section class="panel"><h2>搜索资料</h2><form id="search-form" class="search"><label class="grow"><span class="sr">搜索关键词</span><input id="query" placeholder="例如：芯片 学习" maxlength="512" required></label><button class="primary">搜索</button></form><p class="hint">只显示本机已授权的元数据；私密条目需要独立的元数据展示许可。当前不显示正文或摘录。</p></section><div class="workspace"><section><div class="section-head"><h2>搜索记录</h2><button id="refresh">刷新</button></div><div id="tasks"></div></section><section aria-live="polite"><h2>结果与等待状态</h2><div id="results" class="panel"><p class="hint">选择一项搜索，查看结果和节点进度。</p></div></section></div><details class="panel"><summary>操作审计</summary><button id="audit-button">读取最近操作</button><div id="audit"></div></details></section>
<footer>原始资料由本机保管 · Mac 离线时，搜索会保留并等待恢复</footer></main></body></html>
