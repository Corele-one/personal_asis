<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal Asis · 本机聊天</title><link rel="stylesheet" href="/conversation.css"></head><body><main><header><div><h1>Asis</h1><p>本机持续对话 · 工具按需使用</p></div><label>会话 <select id="sessions" aria-label="选择会话"></select></label><button id="new-chat">新会话</button></header><section id="messages" aria-live="polite"></section><p id="progress" role="status"></p><nav id="controls" hidden><button id="approve">同意执行</button><button id="deny">拒绝</button><button id="resume">恢复本轮</button><button id="cancel">取消本轮</button></nav><form id="composer"><textarea id="input" rows="2" maxlength="512" placeholder="直接输入消息，Enter 发送，Shift+Enter 换行" required></textarea><button id="send" type="submit">发送</button></form><footer><span id="budget">正在读取共享预算…</span> · <button id="forget">清除此会话内容</button> · 本机回环服务 · 完整回复与步骤事件</footer></main><script src="/conversation.js" defer></script></body></html>
