[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-asis"
version = "2.0.0"
description = "Mac Pi knowledge agent, AstrBot life plugin, and confirmed daily sync"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=6,<7", "cryptography>=44"]
backup = ["cryptography>=44"]
reader = ["cryptography>=44"]
test-formats = ["reportlab>=4,<5"]
semantic = ["sentence-transformers>=5,<6", "transformers>=4.41,<5"]

[project.scripts]
asis = "personal_asis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
personal_asis = ["web/*", "wincred.ps1", "*.mjs", "*.go"]
