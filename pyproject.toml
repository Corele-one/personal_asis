[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-asis"
version = "0.1.0"
description = "Local evidence retrieval and permission-bounded model analysis"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=6,<7", "cryptography>=44"]
backup = ["cryptography>=44"]
reader = ["cryptography>=44"]
test-formats = ["reportlab>=4,<5"]
semantic = ["sentence-transformers>=5,<6"]

[project.scripts]
asis = "personal_asis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
personal_asis = ["web/*", "wincred.ps1"]
